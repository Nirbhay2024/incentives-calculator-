name = "incentives-calculator2"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Static frontend build (npm run build -> dist/), served for any request
# that isn't /api/*. single-page-application fallback means direct links
# like /admin still work (serves index.html, client-side router takes over).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# env.DB inside worker/index.js and functions/**. Workers read this binding
# straight from this file on `wrangler deploy` — no dashboard step needed.
[[d1_databases]]
binding = "DB"
database_name = "incentives-calculator-db"
database_id = "994985a2-4c0f-4568-a7f3-c47f790817f5"
